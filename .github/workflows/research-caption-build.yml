name: Research caption auth bundle
on:
  push:
    branches: [research/caption-429-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build research MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Inventory outputs
        run: find patches/build/libs -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Upload MPP
        uses: actions/upload-artifact@v4
        with:
          name: caption-429-auth-research-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
