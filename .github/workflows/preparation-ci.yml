name: Source and runtime checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Inspect exact source index
        run: python tools/check_publish_safety.py
      - name: Python safety and production contracts
        run: python -B -m unittest discover -s tests -p "test*.py"
      - name: Standalone Java runtime tests (JDK 21; no user APK)
        run: python tools/run_runtime_tests.py --jdk "$JAVA_HOME"
